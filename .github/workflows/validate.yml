name: Validate scaffold
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Initialize required references
        run: git submodule update --init --checkout -- references/ti-mods tools/TerraInvictaMCP
      - name: Check scaffold
        run: python tools/ti.py test --offline
      - name: Check pinned MCP Python without the game
        run: python -m unittest discover -s tools/TerraInvictaMCP/server/tests
      - name: Record runtime requirement
        run: Write-Output 'Game-dependent compilation and runtime recipes require a local licensed TI/UMM installation and are not executed in public CI.'
